[package]
name = "cipher-canvas"
version = "1.0.0"
description = "Secure steganography desktop app (AES-256-GCM + LSB + PRNG)"
authors = ["Cipher Canvas"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "cipher_canvas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
