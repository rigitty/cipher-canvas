name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python Engine Binary
        run: |
          pyinstaller cipher-engine.spec --noconfirm

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend dependencies
        working-directory: ./web
        run: npm ci

      - name: Build Tauri Desktop Application & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./web
          tagName: v__VERSION__
          releaseName: "Cipher Canvas v__VERSION__"
          releaseBody: |
            <div align="center">
              <img src="https://raw.githubusercontent.com/rigitty/cipher-canvas/main/web/public/logo.png" width="90" alt="Cipher Canvas Logo" />
              <h2>Cipher Canvas v__VERSION__</h2>
              <p><strong>Stealthy, secure, and robust image steganography for desktop.</strong></p>
            </div>

            ---

            ### What is Cipher Canvas?
            Cipher Canvas is a modern, lightweight desktop application designed for secure data concealment. It allows you to encrypt and seamlessly embed confidential files or messages inside everyday images without noticeable visual distortion or statistical anomalies.

            ### Key Highlights
            * **Authenticated Encryption**: Every payload is encrypted with **AES-256-GCM** prior to embedding. Passphrases are hardened using memory-intensive **Argon2id** key derivation to guard against GPU brute-force attacks.
            * **Imperceptible Steganography**: PRNG-driven pseudorandom pixel distribution and LSB substitution preserve carrier image fidelity without detectable perceptual artifacts.
            * **Tamper Resilience (FEC)**: Built-in **Reed-Solomon Forward Error Correction** safeguards hidden data against compression noise, cropping, and file degradation.
            * **Multi-Carrier Sharding**: Automatically partition large confidential files across multiple carrier images using adaptive capacity-proportional allocation.
            * **Quality Assurance Metrics**: Live perceptual fidelity scoring (**PSNR**, **SSIM**, **MSE**, and **BPP**) to verify zero perceptible distortion before saving or sharing.
            ---

            ### Installation (Windows)
            Download your preferred installer from the **Assets** section below:
            * **`.exe` (Recommended)**: Setup wizard with automatic desktop and start menu shortcuts.
            * **`.msi`**: Standard Windows Installer package for system-wide or silent deployments.

            > **Windows SmartScreen Note**: As this is an open-source release without an expensive commercial EV code-signing certificate, Windows SmartScreen may show an *"Unknown Publisher"* warning on first launch. Click **More info ➔ Run anyway** to proceed.
          releaseDraft: false
          prerelease: false
