name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python Engine Binary
        run: |
          pyinstaller cipher-engine.spec --noconfirm

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend dependencies
        working-directory: ./web
        run: npm ci

      - name: Build Tauri Desktop Application & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./web
          tagName: v__VERSION__
          releaseName: "Cipher Canvas v__VERSION__"
          releaseBody: |
            ## Cipher Canvas v__VERSION__ 🚀
            
            ### Windows Downloads
            Please download the installer (`.msi` or `.exe`) from the assets section below.
            
            ### Highlights
            - **Steganography Engine**: AES-256-GCM + Argon2id KDF + Zstandard compression.
            - **Robustness**: Reed-Solomon Forward Error Correction (FEC) & multi-image proportional sharding.
            - **Quality Analysis**: Full PSNR, SSIM, MSE, and BPP metric verification.
            - **Desktop Experience**: Tauri v2 + React modern UI with native system integration.
          releaseDraft: false
          prerelease: false
